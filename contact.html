<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | Benaya</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --navy: #0a192f; --gold: #c5a059; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--navy); color: #fff; }
        
        .page-wrapper { 
            min-height: 100vh; 
            background: linear-gradient(rgba(10, 25, 47, 0.9), rgba(10, 25, 47, 0.9)), url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?q=80&w=2000'); 
            background-size: cover; display: flex; align-items: center; justify-content: center; padding: 40px; 
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); 
            padding: 80px; 
            border-radius: 60px; 
            border: 1px solid var(--gold); 
            text-align: center; 
            width: 100%; 
            max-width: 650px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.6);
        }

        .social-link { 
            display: flex; align-items: center; justify-content: center; gap: 20px;
            padding: 25px; margin: 20px 0; 
            background: rgba(255,255,255,0.03); 
            color: var(--gold); text-decoration: none; 
            border-radius: 30px; font-size: 1.5rem; font-weight: bold;
            transition: all 0.5s ease; border: 1px solid var(--gold);
        }

        .social-link:hover { 
            background: var(--gold); 
            color: var(--navy); 
            transform: translateX(-20px) scale(1.05);
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.4);
        }

        .footer-bar { padding: 40px; background: var(--black); color: var(--gold); text-align: center; border-top: 2px solid var(--gold); }
    </style>
</head>
<body>
    <section class="page-wrapper">
        <div class="glass-card animate__animated animate__zoomIn">
            <h1 class="animate__animated animate__fadeInDown animate__delay-1s" style="color:var(--gold);">تواصل معنا</h1>
            
            <a href="#" class="social-link animate__animated animate__fadeInRight animate__delay-1s"><i class="fab fa-whatsapp"></i> واتساب - الاستشارات</a>
            <a href="#" class="social-link animate__animated animate__fadeInRight animate__delay-2s"><i class="fab fa-instagram"></i> انستغرام - العروض</a>
            <a href="#" class="social-link animate__animated animate__fadeInRight animate__delay-3s"><i class="fab fa-tiktok"></i> تيك توك - جولات</a>
            <a href="#" class="social-link animate__animated animate__fadeInRight animate__delay-4s"><i class="fab fa-telegram"></i> تلجرام - أخبارنا</a>
            
            <a href="index.html" class="animate__animated animate__fadeInUp animate__delay-5s" style="color:#fff; opacity:0.6; display:block; margin-top:40px; font-size: 1.2rem;">العودة للرئيسية</a>
        </div>
    </section>
    <footer class="footer-bar">جميع الحقوق محفوظة لشركة Benaya للاستثمار العقاري &copy; 2026</footer>
</body>
</html>
