<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benaya | الفخامة العقارية المتكاملة</title>
    
    <!-- الأيقونة -->
    <link rel="icon" type="image/png" href="Logo2.png">
    
    <!-- Schema Markup لتعريف الموقع لمحركات البحث -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Benaya | الفخامة العقارية المتكاملة",
      "url": "https://www.benaya.qzz.io/"
    }
    </script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap');
        
        :root { 
            --navy: #0a192f; 
            --gold: #c5a059; 
            --black: #000000;
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        body { 
            margin: 0; 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--navy); 
            color: #fff; 
            overflow-x: hidden; 
        }

        /* Hero Section */
        .hero { 
            height: 100vh; 
            background: linear-gradient(rgba(10, 25, 47, 0.8), rgba(10, 25, 47, 0.8)), url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?q=80&w=2000'); 
            background-size: cover; 
            background-position: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            padding: 80px 50px; 
            border-radius: 50px; 
            border: 1px solid var(--gold); 
            text-align: center; 
            width: 100%; 
            max-width: 700px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-25px); } 
            100% { transform: translateY(0px); } 
        }

        h1 { font-size: 5rem; color: var(--gold); margin-bottom: 20px; }

        .cta-btn { 
            display: inline-block; 
            padding: 20px 60px; 
            background: var(--gold); 
            color: var(--navy); 
            font-weight: 700; 
            font-size: 1.3rem; 
            border-radius: 50px; 
            text-decoration: none; 
            margin-top: 40px;
            animation: pulse 2s infinite;
        }

        /* Services Grid */
        .services-section { padding: 120px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; max-width: 1200px; margin: 0 auto; }
        .card { 
            padding: 50px 30px; 
            background: rgba(255,255,255,0.02); 
            border: 1px solid var(--gold); 
            border-radius: 30px; 
            text-align: center; 
            transition: var(--transition);
        }
        .card:hover { 
            transform: translateY(-25px) scale(1.05); 
            background: var(--gold); 
            color: var(--navy); 
            box-shadow: 0 25px 50px rgba(197, 160, 89, 0.4);
        }

        .footer-bar { padding: 40px; background: var(--black); color: var(--gold); text-align: center; border-top: 2px solid var(--gold); }
    </style>
</head>
<body>
    <section class="hero">
        <div class="glass-card animate__animated animate__zoomIn">
            <h1 class="animate__animated animate__fadeInDown animate__delay-1s">Benaya</h1>
            <p class="animate__animated animate__fadeInUp animate__delay-1s" style="font-size: 1.6rem;">الاستثمار العقاري المتكامل | العاصمة على أرضك</p>
            <a href="contact.html" class="cta-btn">تواصل معنا الآن</a>
        </div>
    </section>

    <section class="services-section">
        <div class="grid">
            <div class="card animate__animated animate__fadeInUp" style="animation-delay: 0.2s;"><i class="fa fa-building fa-4x"></i><h3>مقاولات عامة</h3></div>
            <div class="card animate__animated animate__fadeInUp" style="animation-delay: 0.4s;"><i class="fa fa-drafting-compass fa-4x"></i><h3>تصميم هندسي</h3></div>
            <div class="card animate__animated animate__fadeInUp" style="animation-delay: 0.6s;"><i class="fa fa-handshake fa-4x"></i><h3>إدارة مشاريع</h3></div>
            <div class="card animate__animated animate__fadeInUp" style="animation-delay: 0.8s;"><i class="fa fa-chart-line fa-4x"></i><h3>استثمار عقاري</h3></div>
            <div class="card animate__animated animate__fadeInUp" style="animation-delay: 1.0s;"><i class="fa fa-leaf fa-4x"></i><h3>تطوير عمراني</h3></div>
        </div>
    </section>
    
    <footer class="footer-bar">جميع الحقوق محفوظة لشركة Benaya للاستثمار العقاري &copy; 2026</footer>
</body>
</html>
